name: Test & Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: Backend + Frontend Coverage (>= 75%)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native CGo & Wayland test headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-layer-shell-dev \
            libpam0g-dev \
            libwayland-dev \
            libx11-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build & Generate Coverage Reports
        run: make build

      - name: Upload Coverage Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/backend.cov
            coverage/frontend/lcov.info
            coverage/frontend/coverage-summary.json
            coverage/summary.json
            coverage/summary.md
          retention-days: 14

      - name: Upload to Codecov (optional, zero-cost on public repos)
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage/backend.cov,./coverage/frontend/lcov.info
          fail_ci_if_error: false
