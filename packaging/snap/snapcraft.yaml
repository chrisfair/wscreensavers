name: wscreensavers
base: core24
version: '1.1.9'
summary: Native Wayland screensaver and live desktop wallpaper suite
description: |
  WScreenSavers brings classic and modern screensavers to Wayland with 24
  built-in WebGL visualizers, PAM screen locking, and live desktop wallpapers.
grade: stable
confinement: classic

apps:
  wscreensavers:
    command: usr/bin/wscreensavers
    plugs:
      - wayland
      - x11
      - opengl
      - desktop
      - desktop-legacy
      - audio-playback
  ctl:
    command: usr/bin/wscreensavers ctl

parts:
  wscreensavers:
    plugin: nil
    build-packages:
      - golang
      - nodejs
      - npm
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - libgtk-layer-shell-dev
      - libpam0g-dev
    override-build: |
      make build
      make install DESTDIR=$SNAPCRAFT_PART_INSTALL PREFIX=/usr
